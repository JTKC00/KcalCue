<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>KcalCue · 天文台預報</title>
<style>
  :root {
    --navy: #0f3c7a; --navy-2: #0b2f60; --sky: #eaf2fb; --sky-2: #d6e4f5; --line: #c9dbf0;
    --white: #ffffff; --warm: #e8762b; --cool: #2b6cb0; --ink: #1b2633; --ink-2: #4f5f73;
    --sans: -apple-system, "PingFang HK", "Noto Sans HK", "Microsoft JhengHei", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 390px; height: 844px; overflow: hidden; }
  body { background: var(--sky); color: var(--ink); font-family: var(--sans); position: relative; font-variant-numeric: tabular-nums; }
  header { background: var(--navy); color: #fff; padding: 12px 16px 10px; }
  .row { display: flex; justify-content: space-between; align-items: center; }
  .brand { font-size: 22px; font-weight: 700; letter-spacing: .01em; }
  .acct { font-size: 14px; color: #cfe0f6; border: 1px solid #6f93c4; border-radius: 6px; height: 36px; padding: 0 12px; display: flex; align-items: center; }
  .sub { margin-top: 8px; font-size: 13px; color: #bfd6f2; display: flex; justify-content: space-between; }
  .sub b { color: #fff; font-weight: 600; }
  main { padding: 14px 14px 0; }
  .fc { background: var(--white); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .fc-top { display: grid; grid-template-columns: 1fr 64px; gap: 8px; }
  .lbl { font-size: 13px; color: var(--ink-2); font-weight: 600; }
  .big { font-size: 50px; font-weight: 700; color: var(--navy); letter-spacing: -0.02em; line-height: 1.05; margin-top: 4px; }
  .big small { font-size: 18px; font-weight: 600; margin-left: 4px; }
  .meta { font-size: 13px; color: var(--ink-2); margin-top: 4px; }
  .vbar { position: relative; width: 64px; height: 112px; }
  .vbar .track { position: absolute; left: 26px; width: 12px; top: 8px; bottom: 8px; background: var(--sky-2); border-radius: 6px; }
  .vbar .fill { position: absolute; left: 26px; width: 12px; border-radius: 6px; background: var(--warm); }
  .vbar .t { position: absolute; left: 44px; font-size: 12px; font-weight: 700; color: var(--warm); }
  .days { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 12px; border-top: 1px solid var(--line); }
  .day { padding: 10px 6px 2px; text-align: center; border-right: 1px solid var(--line); }
  .day:last-child { border-right: 0; }
  .day span { font-size: 13px; font-weight: 600; color: var(--ink-2); }
  .mini { width: 8px; height: 44px; margin: 8px auto; background: var(--sky-2); border-radius: 4px; position: relative; }
  .mini b { position: absolute; left: 0; right: 0; background: var(--cool); border-radius: 4px; }
  .day strong { font-size: 16px; font-weight: 700; }
  .day em { font-style: normal; font-size: 12px; color: var(--ink-2); margin-left: 2px; }
  .gap { margin-top: 10px; font-size: 12px; color: var(--ink-2); display: flex; gap: 6px; align-items: center; }
  .hatch { display: inline-block; width: 22px; height: 10px; border-radius: 2px; border: 1px solid var(--ink-2); background: repeating-linear-gradient(-45deg, var(--ink-2) 0 1px, transparent 1px 4px); }
  .actions { display: grid; grid-template-columns: 1.5fr 1fr; gap: 8px; margin-top: 12px; }
  .btn { height: 50px; border-radius: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 700; }
  .btn.cam { background: var(--navy); color: #fff; }
  .btn.man { background: var(--white); color: var(--navy); border: 1.5px solid var(--navy); }
  .list { margin-top: 12px; background: var(--white); border: 1px solid var(--line); border-radius: 10px; }
  .meal { padding: 11px 14px 12px; border-bottom: 1px solid var(--line); }
  .meal:last-child { border-bottom: 0; }
  .mh { display: grid; grid-template-columns: 52px 1fr auto; gap: 8px; align-items: baseline; }
  .mh time { font-size: 13px; color: var(--ink-2); font-weight: 600; }
  .mh time b { display: block; color: var(--ink); font-size: 15px; }
  .mh h3 { font-size: 16px; font-weight: 700; }
  .mh .r { font-size: 15px; font-weight: 700; color: var(--navy); }
  .hbar { position: relative; height: 8px; margin: 8px 0 0 60px; background: var(--sky-2); border-radius: 4px; }
  .hbar b { position: absolute; top: 0; bottom: 0; background: var(--warm); border-radius: 4px; }
  .hbar.unknown { background: repeating-linear-gradient(-45deg, #9fb3c8 0 1px, var(--sky) 1px 5px); }
  .muted .mh h3 { color: var(--ink-2); font-weight: 500; }
  nav { position: absolute; left: 0; right: 0; bottom: 0; height: 78px; background: var(--white); border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr 96px 1fr; align-items: center; }
  nav a { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 12px; font-weight: 600; color: var(--ink-2); }
  nav a.on { color: var(--navy); }
  nav .add { justify-self: center; width: 60px; height: 60px; border-radius: 50%; background: var(--navy); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; margin-top: -18px; box-shadow: 0 0 0 5px var(--white); }
  svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
  <header>
    <div class="row"><span class="brand">KcalCue</span><span class="acct">帳戶</span></div>
    <div class="sub"><b>今日飲食 · 11月23日 星期一</b><span>已同步 下午1:12</span></div>
  </header>
  <main>
    <section class="fc">
      <div class="fc-top">
        <div>
          <p class="lbl">已知部分卡路里</p>
          <p class="big">325–660<small>kcal</small></p>
          <p class="meta">2 餐 · 早餐、午餐</p>
        </div>
        <div class="vbar">
          <span class="track"></span>
          <span class="fill" style="top:38px;bottom:30px"></span>
          <span class="t" style="top:30px">660</span>
          <span class="t" style="bottom:22px">325</span>
        </div>
      </div>
      <div class="days">
        <div class="day"><span>蛋白質</span><div class="mini"><b style="top:26px;bottom:8px"></b></div><strong>10–24</strong><em>g</em></div>
        <div class="day"><span>碳水</span><div class="mini"><b style="top:8px;bottom:14px"></b></div><strong>75–154</strong><em>g</em></div>
        <div class="day"><span>脂肪</span><div class="mini"><b style="top:24px;bottom:10px"></b></div><strong>8–27</strong><em>g</em></div>
      </div>
      <p class="gap"><i class="hatch"></i>1 餐未完整計入，未知不代表零。</p>
    </section>
    <div class="actions">
      <span class="btn cam"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>AI 相片辨識</span>
      <span class="btn man">＋ 手動記餐</span>
    </div>
    <section class="list">
      <article class="meal">
        <div class="mh"><time><b>早餐</b>08:15</time><h3>港式奶茶、菠蘿包</h3><span class="r">約 325–660</span></div>
        <div class="hbar"><b style="left:20%;width:21%"></b></div>
      </article>
      <article class="meal">
        <div class="mh"><time><b>午餐</b>13:05</time><h3>白飯、叉燒</h3><span class="r">未知</span></div>
        <div class="hbar unknown"></div>
      </article>
      <article class="meal muted">
        <div class="mh"><time><b>晚餐</b></time><h3>未有記錄</h3><span></span></div>
      </article>
    </section>
  </main>
  <nav>
    <a class="on"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>今日</a>
    <span class="add"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>新增</span>
    <a><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/><path d="M12 8v4l3 2"/></svg>歷史</a>
  </nav>
</body>
</html>
