name: Private trial container

on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/**
      - public/**
      - Dockerfile
      - .dockerignore
      - .gcloudignore
      - deploy/cloudbuild.yaml
      - package.json
      - package-lock.json
      - next.config.ts
      - tsconfig.json
      - next-env.d.ts
      - scripts/check-codecs.mjs
      - scripts/smoke-container.mjs
      - .github/workflows/container.yml

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Verify private fixtures stay out of Docker context
        shell: bash
        run: |
          set -euo pipefail
          touch src/.env.local src/service-account.json src/private-meal.gif scripts/local-note.txt public/private-meal.jpg
          probe=""
          cleanup() {
            rm -f src/.env.local src/service-account.json src/private-meal.gif scripts/local-note.txt public/private-meal.jpg
            if [[ -n "$probe" ]]; then docker rm -f "$probe" >/dev/null; fi
          }
          trap cleanup EXIT
          docker build --tag kcalcue:context-probe --file - . <<'DOCKERFILE'
          FROM scratch
          COPY . /context
          CMD ["/bin/true"]
          DOCKERFILE
          probe="$(docker create kcalcue:context-probe)"
          context_dir="$(mktemp -d)"
          docker cp "$probe:/context/." "$context_dir"
          for path in src/.env.local src/service-account.json src/private-meal.gif scripts/local-note.txt public/private-meal.jpg scripts/e2e-server.mjs; do
            if [[ -e "$context_dir/$path" ]]; then
              echo "::error::Unexpected build-context path: $path"
              exit 1
            fi
          done
          for path in src/app/page.tsx public/icon-192.png scripts/check-codecs.mjs scripts/smoke-container.mjs; do
            if [[ ! -f "$context_dir/$path" ]]; then
              echo "::error::Missing build-context path: $path"
              exit 1
            fi
          done
      - name: Verify Cloud Build Docker 20.10 context matches the official builder
        shell: bash
        run: |
          set -euo pipefail
          touch src/.env.local src/service-account.json src/private-meal.gif src/local-note.txt scripts/local-note.txt public/private-meal.jpg
          probe=""
          probe_dockerfile=""
          cleanup() {
            rm -f src/.env.local src/service-account.json src/private-meal.gif src/local-note.txt scripts/local-note.txt public/private-meal.jpg
            if [[ -n "$probe" ]]; then docker rm -f "$probe" >/dev/null; fi
            if [[ -n "$probe_dockerfile" ]]; then rm -f "$probe_dockerfile"; fi
          }
          trap cleanup EXIT
          probe_dockerfile="$(mktemp)"
          printf '%s\n' 'FROM scratch' 'COPY . /context' 'CMD ["/bin/true"]' > "$probe_dockerfile"
          # Same client Cloud Build uses. Newer GitHub Docker accepts nested
          # file exceptions whose parent directories stay ignored. The client
          # tars /work itself; the host daemon only receives that archive.
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/work" \
            -v "$probe_dockerfile:/probe.Dockerfile:ro" \
            --entrypoint docker \
            gcr.io/cloud-builders/docker@sha256:bbb3d633c5c2813b2ce5245852979e1d637768f4acfc504d8ece288f91e9b60f \
            build --no-cache -f /probe.Dockerfile -t kcalcue:cloud-build-context /work
          probe="$(docker create kcalcue:cloud-build-context)"
          context_dir="$(mktemp -d)"
          docker cp "$probe:/context/." "$context_dir"
          for path in src/.env.local src/service-account.json src/private-meal.gif src/local-note.txt scripts/local-note.txt public/private-meal.jpg scripts/e2e-server.mjs scripts/cloud-run.mjs; do
            if [[ -e "$context_dir/$path" ]]; then
              echo "::error::Cloud Build context included: $path"
              exit 1
            fi
          done
          while IFS= read -r path; do
            if [[ ! -f "$context_dir/$path" ]]; then
              echo "::error::Cloud Build context missing: $path"
              exit 1
            fi
          done < <(find src -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.css' \))
          while IFS= read -r path; do
            case "$path" in
              *.ts|*.tsx|*.css) ;;
              *)
                echo "::error::Cloud Build context included non-source: $path"
                exit 1
                ;;
            esac
          done < <(cd "$context_dir" && find src -type f)
          for path in public/icon-192.png scripts/check-codecs.mjs scripts/smoke-container.mjs; do
            if [[ ! -f "$context_dir/$path" ]]; then
              echo "::error::Cloud Build context missing: $path"
              exit 1
            fi
          done
      - name: Build secret-free image and verify HEVC in builder and runtime
        run: >-
          docker build --tag kcalcue:ci
          --build-arg NEXT_PUBLIC_FIREBASE_API_KEY=test-firebase-key
          --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID=demo-kcalcue
          --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=demo-kcalcue.firebaseapp.com
          --build-arg NEXT_PUBLIC_FIREBASE_APP_ID=1:123456:web:test .
      - name: Runtime smoke test (no live APIs)
        shell: bash
        run: |
          docker run --detach --name kcalcue-ci kcalcue:ci
          trap 'docker rm -f kcalcue-ci' EXIT
          for attempt in {1..30}; do
            if docker exec kcalcue-ci node -e 'fetch("http://127.0.0.1:8080/api/status").then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))'; then
              break
            fi
            sleep 1
          done
          docker exec kcalcue-ci node scripts/smoke-container.mjs
